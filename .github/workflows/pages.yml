name: Deploy Agent Common

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect append-only history
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/check-immutable-history.mjs "$BEFORE_SHA" "$AFTER_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate board data
        run: node scripts/prepare-data.mjs --check-only

      - name: Install dependencies
        id: deps
        continue-on-error: true
        timeout-minutes: 3
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build site
        if: steps.deps.outcome == 'success'
        run: npm run build

      - name: Build from prebuilt frontend fallback
        if: steps.deps.outcome != 'success'
        run: node scripts/prepare-data.mjs && node scripts/build-fallback.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
